{% extends 'base.html' %}
{% block content %}
<div class="main-box" style="max-width: 600px; margin: 30px auto;">
    <h3 class="mb-4">🎬 Добавить фильм в дневник</h3>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Название фильма *</label>
            <input type="text" name="title" class="form-control" required placeholder="Например: Начало">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Год выхода</label>
                <input type="number" name="year" class="form-control" placeholder="2024">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Дата просмотра</label>
                <input type="date" name="watch_date" class="form-control">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Жанр</label>
            <select name="genre_id" class="form-select">
                <option value="">-- Не выбрано --</option>
                {% for g in genres %}
                <option value="{{ g[0] }}">{{ g[1] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Оценка (1-10) *</label>
            <input type="number" name="rating" class="form-control" min="1" max="10" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Комментарий</label>
            <textarea name="review" class="form-control" rows="3" placeholder="Впечатления, плюсы/минусы..."></textarea>
        </div>

        <button type="submit" class="btn btn-success w-100">💾 Сохранить</button>
    </form>

    <div class="mt-3 text-center">
        <a href="/account">← Вернуться в кабинет</a>
    </div>
</div>
{% endblock %}
